id = "keepawake"
name = "keepawake"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Prevent macOS from sleeping while any herdr agent pane is working; allow sleep when all are idle."
platforms = ["macos"]

# Re-evaluate global agent state whenever any pane's agent status changes.
[[events]]
on = "pane.agent_status_changed"
command = ["./keepawake.sh"]
platforms = ["macos"]
